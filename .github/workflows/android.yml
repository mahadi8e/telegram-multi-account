name: Android Debug Build

# Builds the fork on GitHub's runners because Gradle's daemon loopback
# TCP is blocked in the local dev VM. Runs on every push to master and
# on manual dispatch. Produces a debug APK as a downloadable artifact.
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      # TG: 11 consecutive builds died mid-compile with the runner losing
      # communication and no logs. The Telegram build is huge and the
      # GitHub runner only has ~14 GB free, so free space before building.
      # Never touches the preinstalled Android SDK ($ANDROID_SDK_ROOT).
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache /usr/share/swift /var/lib/docker 2>/dev/null || true
          sudo apt-get clean 2>/dev/null || true
          df -h /

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK packages
        run: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          # TG: cache disabled after 6 consecutive builds died mid-compile
          # with the runner losing communication (no logs); rules out a
          # corrupt/oversize Gradle cache and lowers runner memory pressure.
          cache-disabled: true

      - name: Inject Telegram API credentials
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          if [ -z "$TG_API_ID" ] || [ -z "$TG_API_HASH" ]; then
            echo "::error::TG_API_ID / TG_API_HASH secrets are not set on this repo"
            exit 1
          fi
          sed -i "s/public static int APP_ID = .*/public static int APP_ID = $TG_API_ID;/" TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
          sed -i "s|public static String APP_HASH = .*|public static String APP_HASH = \"$TG_API_HASH\";|" TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
          grep -q "public static int APP_ID = $TG_API_ID;" TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java && echo "APP_ID injected"
          grep -q "APP_HASH" TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java && echo "APP_HASH line present"

      - name: Restore google-services.json
        env:
          TG_GOOGLE_SERVICES_JSON: ${{ secrets.TG_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$TG_GOOGLE_SERVICES_JSON" ]; then
            echo "::error::TG_GOOGLE_SERVICES_JSON secret is not set on this repo"
            exit 1
          fi
          echo "$TG_GOOGLE_SERVICES_JSON" | base64 -d > TMessagesProj_App/google-services.json
          echo "google-services.json restored"

      - name: Build debug APK
        run: ./gradlew :TMessagesProj_App:assembleAfatDebug --stacktrace --max-workers=2

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: telegram-afat-debug
          path: TMessagesProj_App/build/outputs/apk/afat/debug/*.apk
          if-no-files-found: error
